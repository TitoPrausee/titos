# titOS — Hyprland Konfiguration / configuration
# Dunkles, elegantes Gaming-Setup / dark elegant gaming setup

# ─── Monitor ───────────────────────────────────────────────────────────────
# Auto-Konfiguration; anpassen bei Bedarf / auto; adjust as needed
monitor=,preferred,auto,1

# ─── Autostart ─────────────────────────────────────────────────────────────
exec-once = waybar
exec-once = hyprpaper
exec-once = hypridle
exec-once = dunst
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# ─── Umgebungsvariablen / environment ──────────────────────────────────────
env = XCURSOR_SIZE,24
env = XDG_SESSION_TYPE,wayland
# XWayland aktiviert für Spiele-Kompatibilität / XWayland on for game compat
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = MANGOHUD,1

# ─── Eingabe / input ───────────────────────────────────────────────────────
input {
    kb_layout = de
    follow_mouse = 1
    sensitivity = 0
}

# ─── Allgemein / general — titOS Farbschema ───────────────────────────────
general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    # Lila -> Cyan Verlauf / purple to cyan gradient
    col.active_border = rgba(b48cffee) rgba(6ad0e0ee) 45deg
    col.inactive_border = rgba(2a1a3aaa)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 2
    }
    drop_shadow = true
    shadow_range = 12
    col.shadow = rgba(1a1026ee)
}

animations {
    enabled = true
    bezier = smooth, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 6, smooth
    animation = fade, 1, 6, smooth
    animation = workspaces, 1, 6, smooth
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# ─── Gaming-Regeln / gaming rules ──────────────────────────────────────────
# Kein VSync-Tearing-Verlust im Vollbild, Spiele immer im Fokus-Layout
# No tearing penalty in fullscreen; games get an immediate layout
misc {
    vrr = 1                      # Variable Refresh Rate / FreeSync/G-Sync
    vfr = true                   # Variable Frame Rate (spart Strom im Idle)
    disable_hyprland_logo = true
}
# Tearing für Spiele erlauben (niedrigere Latenz) / allow tearing for games
general:allow_tearing = true
windowrulev2 = immediate, class:^(steam_app_).*$
windowrulev2 = fullscreen, class:^(gamescope)$
windowrulev2 = float, title:^(Steam - News)$

# ─── Tastenkürzel / keybindings ────────────────────────────────────────────
$mod = SUPER
bind = $mod, Return, exec, kitty
bind = $mod, Q, killactive,
bind = $mod, M, exit,
bind = $mod, E, exec, thunar
bind = $mod, R, exec, wofi --show drun
bind = $mod, F, fullscreen,
bind = $mod, V, togglefloating,
bind = $mod, B, exec, firefox
bind = $mod, H, exec, kitty -e titos-help     # KI-Assistent / AI assistant
bind = $mod, L, exec, hyprlock

# Screenshots (grim + slurp)
bind = , Print, exec, grim - | wl-copy
bind = $mod, Print, exec, grim -g "$(slurp)" - | wl-copy

# Arbeitsflächen / workspaces 1-9
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Fenster bewegen / move window with mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
